[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-girlfriend"
version = "0.1.0"
description = "Real-time voice companion app"
requires-python = ">=3.10"
dependencies = [
    "RealtimeSTT",
    "pywin32",
    "pydantic-settings",
    "groq",
    "mediapipe",
    "opencv-python",
    "numpy",
    "pygame",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_girlfriend"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["ai_girlfriend"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
